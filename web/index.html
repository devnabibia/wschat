<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wschat</title>
<style>
  :root{
    --bg:#eef1f7; --card:#ffffff; --fg:#1b2030; --muted:#6a7287; --line:#e3e7f0;
    --accent:#5b5bf0; --accent2:#8b5cf6; --accent-fg:#fff;
    --bubble:#f0f2f8; --shadow:0 10px 30px rgba(30,40,90,.10);
    --up:#22c55e; --warn:#f59e0b; --down:#ef4444;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1220; --card:#181c2e; --fg:#e8eaf4; --muted:#8a92ad; --line:#262b44;
      --accent:#7c7cff; --accent2:#a78bfa; --bubble:#222741; --shadow:0 10px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 400px at 10% -10%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, color-mix(in srgb,var(--accent2) 18%,transparent), transparent 60%),
      var(--bg);
  }
  main{max-width:960px;margin:0 auto;padding:20px;min-height:100%;display:flex;flex-direction:column;gap:14px}

  /* header */
  header{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .logo{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  h1{font-size:18px;margin:0;letter-spacing:.2px}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  input{
    font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
  button{
    font:inherit;font-weight:600;color:var(--accent-fg);border:0;border-radius:10px;padding:8px 16px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    transition:transform .08s, filter .15s, box-shadow .15s;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent);
  }
  button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px) scale(.98)}
  #status{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
    padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);
  }
  #status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
  #status[data-state=up]::before{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}
  #status[data-state=warn]::before{background:var(--warn)}
  #status[data-state=down]::before{background:var(--down)}

  /* chat area */
  .cols{display:grid;grid-template-columns:1fr 230px;gap:14px;flex:1;min-height:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .panel>h2{
    font-size:13px;margin:0;padding:12px 16px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  }
  #roomname{color:var(--fg);text-transform:none;letter-spacing:0;font-size:15px}
  #log{height:min(55vh,480px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  #log::-webkit-scrollbar{width:8px} #log::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

  .msg{max-width:78%;align-self:flex-start;animation:pop .18s ease-out}
  .msg .meta{font-size:12px;color:var(--muted);margin:0 6px 3px}
  .msg .body{
    background:var(--bubble);padding:9px 13px;border-radius:16px 16px 16px 4px;
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.me{align-self:flex-end}
  .msg.me .meta{text-align:right}
  .msg.me .body{
    color:var(--accent-fg);border-radius:16px 16px 4px 16px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .note{align-self:center;font-size:12px;color:var(--muted);background:var(--bubble);padding:3px 12px;border-radius:999px}
  .note.err{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* online list */
  aside ul{list-style:none;margin:0;padding:8px;overflow-y:auto;max-height:480px}
  aside li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px}
  aside li:hover{background:var(--bubble)}
  .avatar{
    position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h) 65% 52%);
  }
  .avatar::after{
    content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;
    background:var(--up);border:2px solid var(--card);
  }
  .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .you{margin-left:auto;font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 7px}

  /* composer */
  .send{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
  .send input{flex:1;border:0;background:transparent;padding:8px 10px}
  .send input:focus{box-shadow:none}

  @media (max-width:700px){
    .cols{grid-template-columns:1fr} aside{order:-1} aside ul{display:flex;gap:4px;overflow-x:auto;max-height:none}
    aside li{flex:none} .controls{width:100%} .controls input{flex:1;min-width:0}
  }
</style>
<main>
  <header>
    <div class="brand"><div class="logo">w</div><h1>wschat</h1></div>
    <div class="controls">
      <input id="user" placeholder="username" size="12" autocomplete="off">
      <input id="room" placeholder="room" value="general" size="12" autocomplete="off">
      <button id="connect">Connect</button>
    </div>
    <span id="status" data-state="warn">…</span>
  </header>

  <div class="cols">
    <section class="panel">
      <h2><span id="roomname"># general</span><span>Messages</span></h2>
      <div id="log"></div>
    </section>
    <aside class="panel">
      <h2><span>Online</span><span id="count">0</span></h2>
      <ul id="online"></ul>
    </aside>
  </div>

  <div class="send">
    <input id="msg" placeholder="Type a message and press Enter" autocomplete="off">
    <button id="send">Send</button>
  </div>
</main>
<script type="module" src="js/demo.js"></script>
</html>
